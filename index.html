<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سماء هاجر | سكن وميثاق</title>
    
    <!-- خطوط عربية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-night: #0D0B14;
            --bg-card: rgba(22, 18, 32, 0.95);
            --gold-warm: #F3C98B;
            --rose-accent: #E29578;
            --rose-petal: #DDA15E;
            --text-light: #FAF8F5;
            --text-muted: #B8B0C0;
            --border-glow: rgba(243, 201, 139, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1D152B 0%, var(--bg-night) 100%);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .serif {
            font-family: 'Amiri', serif;
        }

        /* خلفية البتلات المتساقطة الناعمة */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 80% 80%, rgba(226, 149, 120, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 20% 30%, rgba(243, 201, 139, 0.06) 0%, transparent 50%);
            z-index: 1;
        }

        /* شريط التتبع العلوي */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(13, 11, 20, 0.95), transparent);
            z-index: 30;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .brand-title {
            font-size: 1.3rem;
            color: var(--gold-warm);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .counter-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            padding: 0.4rem 1.1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .counter-pill span {
            color: var(--gold-warm);
            font-weight: 700;
        }

        /* مقدمة شاعرية */
        .hero-banner {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 6.5rem 1.5rem 1.5rem;
            max-width: 680px;
            margin: 0 auto;
            pointer-events: none;
        }

        .hero-banner .tagline {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--rose-accent);
            letter-spacing: 2px;
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .hero-banner h1 {
            font-size: 2.3rem;
            color: var(--text-light);
            margin-bottom: 0.8rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        /* قبة النجوم التفاعلية */
        .constellation-sky {
            position: relative;
            width: 100%;
            height: 1050px;
            max-width: 900px;
            margin: 0 auto 3rem;
        }

        /* كائن النجمة والزهرة */
        .sky-object {
            position: absolute;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sky-object:hover {
            transform: scale(1.3);
        }

        /* شكل النجمة المشعة */
        .object-visual {
            width: 15px;
            height: 15px;
            background: var(--gold-warm);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 10px rgba(243, 201, 139, 0.8));
            animation: pulse-twinkle 3s infinite alternate ease-in-out;
            transition: all 0.5s ease;
        }

        /* تحول النجمة لزهرة عند اكتشافها */
        .sky-object.unlocked .object-visual {
            width: 24px;
            height: 24px;
            background: var(--rose-accent);
            clip-path: polygon(50% 0%, 65% 20%, 95% 20%, 75% 50%, 95% 80%, 65% 80%, 50% 100%, 35% 80%, 5% 80%, 25% 50%, 5% 20%, 35% 20%);
            filter: drop-shadow(0 0 14px rgba(226, 149, 120, 0.9));
            animation: blossom-spin 12s infinite linear;
        }

        @keyframes pulse-twinkle {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        @keyframes blossom-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* النافذة المنبثقة للرسائل والقصائد */
        .modal-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 6, 12, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(8px);
        }

        .modal-wrap.show {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            width: 100%;
            max-width: 520px;
            padding: 2.8rem 2.2rem 2.2rem;
            text-align: center;
            position: relative;
            transform: translateY(25px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-wrap.show .letter-card {
            transform: translateY(0);
        }

        .badge-type {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--rose-accent);
            margin-bottom: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .body-letter {
            font-size: 1.25rem;
            line-height: 1.9;
            color: var(--text-light);
            margin-bottom: 2rem;
            white-space: pre-line;
        }

        .poetry-style {
            font-size: 1.35rem;
            color: var(--gold-warm);
            line-height: 2.1;
        }

        .btn-dismiss {
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--gold-warm);
            padding: 0.65rem 2.5rem;
            border-radius: 4px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-dismiss:hover {
            background: var(--gold-warm);
            color: var(--bg-night);
            box-shadow: 0 0 15px rgba(243, 201, 139, 0.4);
        }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <div class="brand-title serif">سماء بيتنا | عبد الرحمن & هاجر</div>
        <div class="counter-pill">المكتشف: <span id="openedCount">0</span> / 20</div>
    </header>

    <div class="hero-banner">
        <span class="tagline">إلى قُرّة العين وسَكَن الروح</span>
        <h1 class="serif">نَجماتٌ في ليلِ بَيْتِنَا</h1>
        <p>كل نجمة هُنا ليست مجرد ضوء، بل سرٌّ، وغزلٌ، وقصيدةٌ، وموقفٌ كتبتهُ لكِ وحدكِ.. المسِي النجمات لتتفتح زهوراً في أولى ليالينا معاً.</p>
    </div>

    <!-- فضاء النجوم العشرين -->
    <main class="constellation-sky" id="skyVault"></main>

    <!-- نافذة الرسالة -->
    <div class="modal-wrap" id="letterModal">
        <div class="letter-card">
            <div class="badge-type" id="letterType">قصيدة لعينيكِ</div>
            <div class="body-letter serif" id="letterBody">...</div>
            <button class="btn-dismiss" onclick="hideModal()">إغلاق ومتابعة المسير</button>
        </div>
    </div>

    <footer>
        <p class="serif">صُنِعَ بحبٍ وصدقٍ لا يفنى | بَيْتُنَا الآمِن</p>
    </footer>

    <script>
        // 20 محطة متكاملة ومتنوعة (أشعار كاملة، غزل، ذكريات حقيقية، عهود رجولية)
        const starLore = [
            {
                type: "قصيدة السَّكَن الأولى",
                isPoetry: true,
                content: "أَضَاءَتْ بِكِ الأَيَّامُ بَعْدَ عَنَائِهَا\nوَحَلَّتْ عَلَى قَلْبِي كَرِيمُ سَمَائِهَا\nفَأَنْتِ رَبِيعُ البَيْتِ، أُنْسُ فُؤَادِهِ\nوَرَوْضَةُ رُوحِي حِينَ يَبْدُو ضِيَاؤُهَا"
            },
            {
                type: "غزل وحقيقة",
                isPoetry: false,
                content: "نورتِ بيتك ومطرحك يا هاجر.. من اللحظة التي دخلتِ فيها هذا الباب، أغلقتُ خلفكِ كل تعب الدنيا. هنا سكنكِ، دلالكِ، وأمانكِ الذي لا ينقص أبداً بإذن الله."
            },
            {
                type: "حكاية من ذكرياتنا",
                isPoetry: false,
                content: "أتذكرين حين أطلقتُ عليكِ لقب (Haru)؟ كنتُ أعلم دائماً أن وراء تلك الرقة الفائضة قلباً ناصعاً كقلب أرنوبة بريئة، استطاعت بهدوئها ولطفها أن تُروّض كل عواصف ذئبها الهادئ."
            },
            {
                type: "قصيدة الميثاق الغليظ",
                isPoetry: true,
                content: "بَنَيْنَا عَلَى اسْمِ اللهِ صَرْحَ وِدَادِنَا\nفَلَمْ نَخْشَ فِي دَرْبِ الحَيَاةِ عَثَارَا\nأُعَاهِدُ رَبِّي أَنْ أَكُونَ لَكِ الحِمَى\nوَأَنْ تَمْلِكِي دُونَ النِّسَاءِ دِيَارَا"
            },
            {
                type: "غزل في الخجل",
                isPoetry: false,
                content: "يشهد الله أن أرقّ وأبهى ما رأيت في حياتي، هو حمرة الخجل حين تعلو وجنتيكِ، وبساطة حديثكِ التي تغنيني عن كلام الدنيا بأسرها."
            },
            {
                type: "طيف من تفاصيلك",
                isPoetry: false,
                content: "كوب الشاي بالنعناع في هدوء الليل، وقطعة الشوكولاتة التي تفتح أبواب الحديث.. تفاصيلكِ الصغيرة هي التي صنعت من أيامي وطناً كنت أبحث عنه منذ زمن."
            },
            {
                type: "قصيدة الأمان",
                isPoetry: true,
                content: "لَيْلِي بِقُرْبِكِ مُشْرِقٌ وَمُعَطَّرُ\nوَحَدِيثُنَا فِي الصَّمْتِ شَهْدٌ سُكَّرُ\nيَا مَنْ غَدَتْ لِي فِي الحَيَاةِ أَمَانَةً\nقَدْرُ الحَبِيبَةِ فِي حِمَايَ مُوَقَّرُ"
            },
            {
                type: "مؤرخة قلبي",
                isPoetry: false,
                content: "درستِ تاريخ الأمم والدول وسهرتِ الليالي من أجل كتبكِ.. واليوم نكتب معاً تاريخ بيتنا الصغير، تاريخاً لا مكان فيه للحزن، عنوانه المودة وخاتمته الرضا."
            },
            {
                type: "عن أناملكِ الصابرة",
                isPoetry: false,
                content: "أعرف كم تُحبين الهاند ميد، وكم تملكين من الصبر لنسج كل خيطٍ بدقة.. وها أنا أضع قلبي بين يديكِ لتنسجي منه حياتنا بروحكِ وفنكِ وذوقكِ الهادئ."
            },
            {
                type: "قصيدة الرضا والغنى",
                isPoetry: true,
                content: "كَفَانِي بِأَنَّكِ لِي مَلاَذٌ وَمَوْئِلٌ\nوَأَنَّكِ لِي عِنْدَ الشَّدَائِدِ دَارِي\nسَأَلْتُ إِلَهَ العَرْشِ حِفْظَكِ دَائِماً\nيَا سَعْدَ قَلْبِي، وَانْشِرَاحَ نَهَارِي"
            },
            {
                type: "شغب العائلة الصغيرة",
                isPoetry: false,
                content: "بالمناسبة، قشطة ونايتي وتيمو في انتظار سيدة البيت الجديدة! كفانا مناهدة وشغباً، واليوم ستشهدين بنفسكِ كيف تذوب كل المشاغبات أمام حنانكِ."
            },
            {
                type: "وعد الرجولة والستر",
                isPoetry: false,
                content: "أعدكِ أمام الله: لن أجعلكِ تحتاجين لأحد، ولن أسمح للدنيا أن تكسر خاطركِ، وستجدينني دائماً الملاذ الذي تلجئين إليه وأنتِ كلكِ يقين بأنه لكِ وحدكِ."
            },
            {
                type: "قصيدة الوصال",
                isPoetry: true,
                content: "وَجَدْتُ بِعَيْنَيْكِ الأمَانَ وَرِفْعَتِي\nوَفِي قُرْبِكِ المَيْمُونِ أُنْسِي وَرَاحَتِي\nإِذَا مَا اشْتَكَتْ نَفْسِي هُمُوماً وَكُرْبَةً\nفَفِي وَجْهِكِ المَأْمُولِ تَبْرَأُ عِلَّتِي"
            },
            {
                type: "ذكريات الشقة والبناء",
                isPoetry: false,
                content: "كل تفصيلة في هذا البيت، من ألوان الخشب، والمطبخ، إلى أدق زاوية اخترناها معاً بالبيج الهادئ، تشهد على سعينا الصادق بأن نبدأ بالحلال ونؤسس للسكون."
            },
            {
                type: "ميثاق الليل والنهار",
                isPoetry: false,
                content: "عهدي معكِ أن نظل 'شخصاً واحداً' كما تمنينا دوماً؛ لا ننام وفي صدورنا عتب، ولا يفرق بيننا غريب، نتشارك اللقمة والضحكة وسجدات الفجر."
            },
            {
                type: "قصيدة الحِصن الحصين",
                isPoetry: true,
                content: "سَأَحْمِيكِ بِالقَلْبِ الَّذِي أَنْتِ نَبْضُهُ\nوَأُعْطِيكِ عَهْداً صَادِقاً لَنْ أَرُدَّهُ\nفَأَنْتِ حِمَايَ وَانْتِمَائِي وَعِزَّتِي\nوَحُبُّكِ فِي صَدْرِي سَأَحْفَظُ عَهْدَهُ"
            },
            {
                type: "غزل في الروح",
                isPoetry: false,
                content: "جمالكِ الحقيقي الذي أسرني لم يكن في الملامح وحدها، بل في ذلك القلب التقيّ الذي يخشى الله، ويستحي من الزلل، ويبحث دائماً عن الحلال الصافي."
            },
            {
                type: "خاطرة المساء",
                isPoetry: false,
                content: "كنتُ أهرب في الماضي إلى البحر والليل لأجد الهدوء.. واليوم، بيتنا معكِ هو بحري وسمائي وهدوئي الذي لا ينتهي."
            },
            {
                type: "قصيدة الختام والعهد",
                isPoetry: true,
                content: "خُذِي كُلَّ عُمْرِي قَدْ جَعَلْتُكِ تَاجَهُ\nفَمَا بَعْدَ هَذَا الوَصْلِ قَلْبِي بَرَاجِي\nأَرَاكِ ضِيَاءَ البَيْتِ، نُورَ صَبَاحِهِ\nوَأَنْتِ لِرُوحِي نَفْحَةٌ مِنْ سِرَاجِي"
            },
            {
                type: "مفتاح الدار الأبدي",
                isPoetry: false,
                content: "مباركٌ عليّ أنتِ، ومباركٌ لكِ قلبي.. أهلاً بكِ في عالمنا، في وطنكِ الصغير، وفي بيتنا الذي باركه الله بالمودة والرحمة. أحبكِ يا هاجر."
            }
        ];

        // إحداثيات 20 كائناً موزعة بجمالية متوازنة هندسياً وفنياً
        const coordinates20 = [
            { top: 10, left: 22 }, { top: 8, left: 78 }, { top: 16, left: 50 },
            { top: 23, left: 14 }, { top: 21, left: 84 }, { top: 30, left: 36 },
            { top: 32, left: 66 }, { top: 40, left: 18 }, { top: 42, left: 82 },
            { top: 48, left: 50 }, { top: 56, left: 28 }, { top: 58, left: 72 },
            { top: 66, left: 12 }, { top: 68, left: 88 }, { top: 74, left: 40 },
            { top: 76, left: 62 }, { top: 83, left: 24 }, { top: 85, left: 76 },
            { top: 92, left: 50 }, { top: 96, left: 32 }
        ];

        let discoveredStars = new Set();
        const skyVault = document.getElementById('skyVault');
        const modal = document.getElementById('letterModal');
        const letterType = document.getElementById('letterType');
        const letterBody = document.getElementById('letterBody');
        const counter = document.getElementById('openedCount');

        // بناء النجوم
        starLore.forEach((item, index) => {
            const star = document.createElement('div');
            star.className = 'sky-object';
            
            const pos = coordinates20[index];
            star.style.top = pos.top + '%';
            star.style.left = pos.left + '%';

            const visual = document.createElement('div');
            visual.className = 'object-visual';
            star.appendChild(visual);

            star.addEventListener('click', () => {
                showLetter(item, index, star);
            });

            skyVault.appendChild(star);
        });

        function showLetter(item, index, starEl) {
            letterType.textContent = item.type;
            letterBody.textContent = item.content;

            if (item.isPoetry) {
                letterBody.classList.add('poetry-style');
            } else {
                letterBody.classList.remove('poetry-style');
            }

            modal.classList.add('show');

            if (!discoveredStars.has(index)) {
                discoveredStars.add(index);
                starEl.classList.add('unlocked');
                counter.textContent = discoveredStars.size;
            }
        }

        function hideModal() {
            modal.classList.remove('show');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                hideModal();
            }
        });
    </script>
</body>
</html>
