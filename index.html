<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سماء هاجر | سكن وميثاق</title>
    
    <!-- خطوط عربية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0A0812;
            --bg-card: rgba(18, 14, 28, 0.96);
            --gold-bright: #FCE1A8;
            --gold-warm: #E5B264;
            --rose-soft: #D98880;
            --rose-glow: rgba(217, 136, 128, 0.4);
            --text-main: #FAF8F5;
            --text-sub: #A8A0B2;
            --border-line: rgba(229, 178, 100, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .serif {
            font-family: 'Amiri', serif;
        }

        /* كانفاس الجزيئات والأغبرة الكونية في الخلفية */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* الهيدر العلوي */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10, 8, 18, 0.95), transparent);
            z-index: 30;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-brand {
            font-size: 1.25rem;
            color: var(--gold-bright);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-audio {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-line);
            color: var(--gold-bright);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.25s ease;
        }

        .btn-audio:hover {
            background: rgba(229, 178, 100, 0.15);
            border-color: var(--gold-bright);
        }

        .counter-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .counter-badge span {
            color: var(--gold-bright);
            font-weight: 700;
        }

        /* المقدمة الترحيبية */
        .intro-section {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 7rem 1.5rem 2rem;
            max-width: 680px;
            margin: 0 auto;
            pointer-events: none;
        }

        .intro-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--rose-soft);
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .intro-section h1 {
            font-size: 2.3rem;
            color: var(--text-main);
            margin-bottom: 0.8rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .intro-section p {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* مساحة السماء والنجوم */
        .stars-container {
            position: relative;
            width: 100%;
            height: 1100px;
            max-width: 900px;
            margin: 0 auto 3rem;
            z-index: 10;
        }

        /* كائن النجمة التفاعلي */
        .sky-star {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sky-star:hover {
            transform: scale(1.3);
        }

        .star-icon {
            width: 15px;
            height: 15px;
            background: var(--gold-bright);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 10px rgba(252, 225, 168, 0.9));
            animation: pulse-twinkle 3s infinite alternate ease-in-out;
            transition: all 0.5s ease;
        }

        /* بعد الضغط: تتحول النجمة إلى زهرة متفتحة بلون روز دافئ */
        .sky-star.opened .star-icon {
            width: 25px;
            height: 25px;
            background: var(--rose-soft);
            clip-path: polygon(50% 0%, 65% 20%, 95% 20%, 75% 50%, 95% 80%, 65% 80%, 50% 100%, 35% 80%, 5% 80%, 25% 50%, 5% 20%, 35% 20%);
            filter: drop-shadow(0 0 14px var(--rose-glow));
            animation: flower-spin 12s infinite linear;
        }

        @keyframes pulse-twinkle {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        @keyframes flower-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* النافذة المنبثقة للرسالة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 4, 8, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-box {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            padding: 3rem 2.2rem 2.2rem;
            text-align: center;
            position: relative;
            transform: translateY(30px);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .modal-overlay.active .letter-box {
            transform: translateY(0);
        }

        /* نص الرسالة والقصيدة */
        .letter-content {
            font-size: 1.25rem;
            line-height: 1.95;
            color: var(--text-main);
            margin-bottom: 2.2rem;
            white-space: pre-line;
        }

        .poetry-text {
            font-size: 1.45rem;
            color: var(--gold-bright);
            line-height: 2.2;
            letter-spacing: 0.5px;
        }

        .btn-close {
            background: transparent;
            border: 1px solid var(--border-line);
            color: var(--gold-warm);
            padding: 0.65rem 2.5rem;
            border-radius: 4px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-close:hover {
            background: var(--gold-warm);
            color: var(--bg-deep);
            box-shadow: 0 0 15px rgba(229, 178, 100, 0.4);
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }
    </style>
</head>

            },
            {
                isPoetry: true,
                content: "خُذِي كُلَّ عُمْرِي قَدْ جَعَلْتُكِ تَاجَهُ\nفَمَا بَعْدَ هَذَا الوَصْلِ قَلْبِي بَرَاجِي\nأَرَاكِ ضِيَاءَ البَيْتِ، نُورَ صَبَاحِهِ\nوَأَنْتِ لِرُوحِي نَفْحَةٌ مِنْ سِرَاجِي"

        // إحداثيات موزعة بدقة هندسية وجمالية على امتداد قبة السماء
        const starLayout = [
            { top: 8, left: 24 }, { top: 7, left: 76 }, { top: 15, left: 50 },
            { top: 22, left: 16 }, { top: 20, left: 84 }, { top: 29, left: 38 },
            { top: 31, left: 66 }, { top: 39, left: 18 }, { top: 41, left: 82 },
            { top: 48, left: 50 }, { top: 56, left: 28 }, { top: 58, left: 74 },
            { top: 66, left: 14 }, { top: 68, left: 88 }, { top: 75, left: 42 },
            { top: 77, left: 62 }, { top: 84, left: 22 }, { top: 86, left: 78 },
            { top: 92, left: 50 }, { top: 96, left: 34 }
        ];

        let discoveredStars = new Set();
        const starsVault = document.getElementById('starsVault');
        const modal = document.getElementById('letterModal');
        const letterText = document.getElementById('letterText');
        const openedCount = document.getElementById('openedCount');

        // ==========================================
        // محرك الصوتيات الإجرائي (Web Audio API)
        // يعمل محلياً 100% دون الحاجة لملفات خارجية أو إنترنت
        // ==========================================
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // رنين النجمة النقي (Chime / Bell Sound Effect)
        function playStarChime() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                // تآلف نغمي كريستالي دافئ (C-Major Pentatonic)
                const pitches = [523.25, 659.25, 783.99, 1046.50]; 
                pitches.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.05);

                    gain.gain.setValueAtTime(0, now + i * 0.05);
                    gain.gain.linearRampToValueAtTime(0.12, now + i * 0.05 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 1.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 1.3);
                });
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        // موسيقى هادئة إجرائية بالخلفية (Ambient Music Box)
        const melodyNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 523.25, 392.00];
        let noteStep = 0;

        function playAmbientNote() {
            if (!isMusicPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const freq = melodyNotes[noteStep % melodyNotes.length];
            noteStep++;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 2.3);

            // تكرار متناغم بين 1.2 و 1.8 ثانية
            musicTimer = setTimeout(playAmbientNote, 1400);
        }

        function toggleAudioEngine() {
            initAudio();
            const label = document.getElementById('audioLabel');
            const icon = document.getElementById('audioIcon');

            if (!isMusicPlaying) {
                isMusicPlaying = true;
                label.textContent = "إيقاف الموسيقى";
                icon.textContent = "✨";
                playAmbientNote();
            } else {
                isMusicPlaying = false;
                label.textContent = "موسيقى هادئة";
                icon.textContent = "🎵";
                clearTimeout(musicTimer);
            }
        }

        // ==========================================
        // محرك الجزيئات البصرية (Visual Particles Canvas)
        // ==========================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let burstParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class AmbientParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedY = Math.random() * 0.3 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > canvas.height) this.y = -10;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
            }
            draw() {
                ctx.fillStyle = `rgba(243, 201, 139, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new AmbientParticle());
        }

        function spawnBurst(originX, originY) {
            for (let i = 0; i < 25; i++) {
                burstParticles.push({
                    x: originX,
                    y: originY,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    size: Math.random() * 3 + 1.5,
                    color: Math.random() > 0.5 ? '#FCE1A8' : '#D98880'
                });
            }
        }

        function renderEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // جزيئات الفضاء البطيئة
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // شرارات الضغط على النجوم
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const b = burstParticles[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life -= b.decay;

                if (b.life <= 0) {
                    burstParticles.splice(i, 1);
                } else {
                    ctx.fillStyle = b.color;
                    ctx.globalAlpha = b.life;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            requestAnimationFrame(renderEngine);
        }
        renderEngine();

        // ==========================================
        // إنشاء وبناء النجوم التفاعلية
        // ==========================================
        starNotes.forEach((item, index) => {
            const star = document.createElement('div');
            star.className = 'sky-star';
            
            const pos = starLayout[index];
            star.style.top = pos.top + '%';
            star.style.left = pos.left + '%';

            const visual = document.createElement('div');
            visual.className = 'star-icon';
            star.appendChild(visual);

            star.addEventListener('click', (e) => {
                const rect = star.getBoundingClientRect();
                spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
                showStarNote(item, index, star);
            });

            starsVault.appendChild(star);
        });

        function showStarNote(item, index, starElement) {
            playStarChime();
            letterText.textContent = item.content;

            if (item.isPoetry) {
                letterText.classList.add('poetry-text');
            } else {
                letterText.classList.remove('poetry-text');
            }

            modal.classList.add('active');

            if (!discoveredStars.has(index)) {
                discoveredStars.add(index);
                starElement.classList.add('opened');
                openedCount.textContent = discoveredStars.size;
            }
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
